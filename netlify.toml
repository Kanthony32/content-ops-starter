# HoopThink: static site. No build step; Netlify serves /site as-is.
[build]
  publish = "site"
  command = "echo 'Static site: no build step'"

# Keep the gated PDF and the thank-you page out of search results.
[[headers]]
  for = "/briefing/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
